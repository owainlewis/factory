[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factory-cli"
version = "0.2.0"
description = "Run a task stage, check the result, and retry with feedback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.1.81,<0.2", "pydantic>=2,<3"]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
