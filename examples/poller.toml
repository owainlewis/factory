# GitHub queues require `gh` installed and authenticated on the poller host.
# Check with `gh --version` and `gh auth status` before starting factory-poller.
server = "http://127.0.0.1:7337"
poll_every = "30s"
data_directory = "poller"

[[queues]]
name = "github-ready"
source = "github"
project = "owner/repository"
status = "open"
labels = ["factory:ready"]
prompt = """
Work on this ticket end to end.
Use the installed GitHub CLI to read the live issue before changing code.
Implement and verify the change, then update the issue and open a pull request.
"""
timeout_seconds = 7200
