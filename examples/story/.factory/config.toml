# Story -> spec -> (human approves) -> build -> gates -> feedback -> retry.
#
#   factory "$(cat story.md)" --stage=spec --attempts=2
#   # read and edit SPEC.md, then:
#   factory "Implement SPEC.md" --stage=build --attempts=3

[stages.spec]
prompt = "SPEC.md"
checks = ["spec-exists", "spec-review"]

[stages.build]
prompt = "BUILD.md"
checks = ["unit", "integration", "review"]

[checks.spec-exists]
command = "test -s SPEC.md || { echo 'SPEC.md is missing or empty'; exit 1; }"

[checks.spec-review]
prompt = "SPEC_REVIEW.md"

# Replace with your project's commands. Exit 0 = pass, 1 = retry with output, other = stop.
[checks.unit]
command = "npm test"

[checks.integration]
command = "./scripts/integration-test.sh"

[checks.review]
prompt = "REVIEW.md"
