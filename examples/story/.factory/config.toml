# Issue -> specs -> (person reviews) -> build -> test and review -> retry.
#
#   factory "$(gh issue view 42)" --stage=spec
#   factory "Implement the specs" --stage=build --attempts=3

[stages.spec]
prompt = "SPEC.md"

[stages.build]
prompt = "BUILD.md"
checks = ["test", "review"]

# Replace with your test command. Exit 0 passes, 1 retries with the output.
[checks.test]
command = "npm test"

[checks.review]
prompt = "REVIEW.md"
