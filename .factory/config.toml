[stages.build]
prompt = "BUILD.md"
checks = ["test", "lint", "format", "review"]

[stages.triage]
prompt = "TRIAGE.md"
pre = ["gh auth status"]
tools = ["Read", "Glob", "Grep", "Bash"]

[checks.test]
command = "uv run pytest"

[checks.lint]
command = "uv run ruff check ."

[checks.format]
command = "uv run ruff format --check ."

[checks.review]
prompt = "REVIEW.md"
