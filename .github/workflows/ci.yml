name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Install UI dependencies
        working-directory: web
        run: npm ci
      - name: Check UI lint
        working-directory: web
        run: npm run lint
      - name: Check UI types
        working-directory: web
        run: npm run typecheck
      - name: Run UI component tests
        working-directory: web
        run: npm test
      - name: Build embedded UI
        env:
          FACTORY_V2_SKIP_INSTALL: "1"
        run: ./scripts/build-v2-ui.sh
      - name: Check embedded UI is current
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git status --porcelain --untracked-files=all -- web/dist)"
      - name: Test Node-free operator build
        run: ./scripts/test-build-v2.sh
      - name: Build V2 Go binaries
        run: ./scripts/build-v2.sh
      - name: Test local startup workflow
        run: ./scripts/test-run-v2-local.sh
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal migrations web/*.go)"
      - name: Run Go vet
        run: go vet ./...
      - name: Check worker-control-plane boundary
        run: |
          ! go list -deps ./internal/worker |
            grep -qx 'github.com/owainlewis/factory/internal/controlplane'
      - name: Run Go server and worker tests
        run: go test -timeout 5m ./...
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run real-server browser tests
        working-directory: web
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: control-plane-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Rust Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --all-targets
