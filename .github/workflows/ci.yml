name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - name: Install UI dependencies
        working-directory: web
        run: npm ci
      - name: Check UI
        run: just ui-check
      - name: Build embedded UI
        run: just ui-build 0
      - name: Check embedded UI is current
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git status --porcelain --untracked-files=all -- web/dist)"
      - name: Test Node-free operator build
        run: just test-tooling
      - name: Build Go binaries
        run: just build
      - name: Test local startup workflow
        run: just test-launcher
      - name: Check Go formatting
        run: just format-check
      - name: Run Go vet
        run: just vet
      - name: Check reachable Go vulnerabilities
        run: just vuln
      - name: Run staticcheck correctness checks
        run: just staticcheck
      - name: Check worker-control-plane boundary
        run: just boundary
      - name: Run Go server and worker tests
        run: just test
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run real-server browser tests
        run: just test-browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-plane-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
